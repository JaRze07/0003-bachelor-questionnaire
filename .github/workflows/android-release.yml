name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci --legacy-peer-deps
      - run: npm test
      - name: Write the API base into the bundle
        run: |
          printf 'globalThis.API_BASE=%s;\n' "\"${{ vars.API_BASE || 'https://bachelor-api.example' }}\"" > web/config.js
          printf 'globalThis.AD_UNIT_BANNER=%s;\n' "\"${{ vars.AD_UNIT_BANNER }}\"" >> web/config.js
          printf 'globalThis.AD_UNIT_INTERSTITIAL=%s;\n' "\"${{ vars.AD_UNIT_INTERSTITIAL }}\"" >> web/config.js
      - run: npx cap sync android

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          BT=$ANDROID_HOME/build-tools/36.0.0
          $BT/zipalign -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk bachelor-questionnaire.apk
          $BT/apksigner sign --ks release.keystore \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            bachelor-questionnaire.apk
          cp android/app/build/outputs/bundle/release/app-release.aab bachelor-questionnaire.aab
          rm release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            bachelor-questionnaire.apk
            bachelor-questionnaire.aab
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bachelor-questionnaire.apk
            bachelor-questionnaire.aab
