name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm ci --legacy-peer-deps --prefix api
      - run: npm test
      - run: npm --prefix api run typecheck
      - run: npm --prefix api test
